name: Publish NuGet (.NET 10)

on:
  push:
    tags:
      - 'v*'    # e.g., v1.2.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required to request the OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/Eru.Cli/Eru.Cli.fsproj --configuration Release --no-restore --output ./artifacts

      # Exchanges the job's OIDC token for a short-lived nuget.org API key.
      # Requires a Trusted Publishing policy on nuget.org for this repo + this workflow file name.
      - name: NuGet login (OIDC to temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org username (profile name), NOT your email address

      - name: Publish to nuget.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --skip-duplicate
